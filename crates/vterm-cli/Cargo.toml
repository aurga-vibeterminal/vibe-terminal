[package]
name = "vterm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "vtermc"
path = "src/main.rs"

[dependencies]
# Internal crates
vterm-common = { workspace = true }
vterm-core = { workspace = true }

# Async runtime
tokio = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# CLI
clap = { workspace = true }

# Terminal handling
crossterm = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# UUID
uuid = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Platform-specific
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["term", "process"] }
signal-hook = "0.3"
libc = "0.2"

[build-dependencies]
# Embeds FileVersion/ProductVersion/LegalCopyright into the executable
# (build.rs), same as the other shipped binaries.
vterm-build = { workspace = true }
